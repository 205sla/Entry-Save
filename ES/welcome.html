<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entry Save Manager 설치 완료</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <main class="welcome-card">
    <img class="app-icon" src="icon128.png" alt="">
    <p class="eyebrow">설치 완료</p>
    <h1>Entry Save Manager 설치가 끝났어요</h1>
    <p class="thanks">Entry Save Manager를 설치해 주셔서 고맙습니다.</p>

    <section class="refresh-notice">
      <div class="refresh-icon" aria-hidden="true">↻</div>
      <div>
        <h2>열어 둔 작품을 새로고침해 주세요</h2>
        <p>
          설치 전에 열어 둔 엔트리 작품이 있다면 페이지를 한 번 새로고침해 주세요.
          새로고침한 뒤부터 Entry Save Manager가 작품에 적용됩니다.
        </p>
      </div>
    </section>

    <a class="guide-link" href="https://www.youtube.com/watch?v=qXCHYcxTIeY"
       target="_blank" rel="noopener noreferrer">
      <span class="link-title">세이브 기능 작품 만들기</span>
      <span class="link-description">
        Entry Save Manager로 엔트리 작품에 저장과 불러오기 기능을 넣는 방법을
        영상으로 확인해 보세요.
      </span>
    </a>

    <p class="unofficial-notice">
      본 확장 프로그램은 엔트리의 공식 확장 프로그램이 아닙니다.
    </p>
  </main>
</body>
</html>
