<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entry Save Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>Entry Save Manager</h1>
  </div>

  <div class="content">
    <div class="info-box">
      <div class="info-row">
        <span class="info-label">현재 상태</span>
        <span class="info-value" id="pageStatus">확인 중...</span>
      </div>
      <div class="info-row">
        <span class="info-label">프로젝트 ID</span>
        <span class="info-value" id="projectId">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">저장된 데이터</span>
        <span class="info-value" id="dataStatus">확인 중...</span>
      </div>
    </div>

    <div class="section-title">데이터 관리</div>

    <button class="btn btn-reset-current" id="btnResetCurrent" disabled>
      현재 작품 초기화
    </button>

    <button class="btn btn-reset-all" id="btnResetAll" disabled>
      모든 데이터 초기화
    </button>
  </div>

  <div class="toast" id="toast">
    <div class="toast-title">✅ <span id="toastTitle"></span></div>
    <div class="toast-msg" id="toastMsg"></div>
    <div class="toast-warn">⚡ 페이지를 새로고침해야 적용됩니다.</div>
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h3 id="confirmTitle"></h3>
      <p id="confirmMsg"></p>
      <div class="confirm-buttons">
        <button class="btn btn-cancel" id="btnConfirmCancel">취소</button>
        <button class="btn btn-danger" id="btnConfirmOk">초기화</button>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
